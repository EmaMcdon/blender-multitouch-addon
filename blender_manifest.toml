schema_version = "1.0.0"

id = "multitouch_viewport"
# Kept in step with bl_info["version"] by build_extension.py
version = "3.21.0"
name = "Multitouch Viewport Navigation"
tagline = "Touchscreen navigation and pen palm rejection on Windows"
maintainer = "EmaMcdon"
type = "add-on"
website = "https://github.com/EmaMcdon/blender-multitouch-addon"

tags = ["3D View", "User Interface", "Sculpt"]

